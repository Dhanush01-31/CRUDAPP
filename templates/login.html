{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container-fluid d-flex justify-content-center align-items-center p-2 vh-100">
        <div class="card shadow-lg w-25 border bordered-5">
            <div class="card-header text-dark text-center py-3 bg-primary"><span class="text-light fw-bold">Login</span></div>
                <div class="card-body">
                    <form class="form" method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <div class="col-sm mb-2">
                            <label class="form-label">Username<span class="text-danger">*</span></label>
                            <input class="form-control" type="text" name="username" placeholder="Username" required>
                        </div>
                        <div class= "col-sm mb-2">
                            <label class="form-label">password<span class="text-danger">*</span></label>
                            <input class="form-control" type="password" name="password" placeholder="password" required>
                        </div>
                        <div class="col-sm  d-flex justify-content-center mt-3 mb-2">
                            <button type="submit" class="btn btn-md btn-primary text-center rounded-2"><span class="text-light fw-semibold">Login</span></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
</div>
{% endblock %}
